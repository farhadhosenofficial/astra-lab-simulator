[['galaxy','milky way','andromeda','গ্যালাক্সি','ছায়াপথ'],`A galaxy is a gravitationally bound system of billions of stars, gas, dust and dark matter. The Milky Way is a barred spiral about 100,000 light-years across with 100-400 billion stars; the Sun orbits its center every ~230 million years. Andromeda, 2.5 million light-years away, will merge with us in roughly 4-5 billion years.`,`গ্যালাক্সি হলো মহাকর্ষে আবদ্ধ কোটি কোটি তারা, গ্যাস, ধূলা ও ডার্ক ম্যাটারের ব্যবস্থা। আমাদের ছায়াপথ প্রায় ১ লক্ষ আলোকবর্ষ চওড়া, এতে ১০০-৪০০ বিলিয়ন তারা; সূর্য প্রায় ২৩ কোটি বছরে একবার কেন্দ্র প্রদক্ষিণ করে। ২৫ লক্ষ আলোকবর্ষ দূরের অ্যান্ড্রোমিডা ৪-৫ বিলিয়ন বছরে আমাদের সাথে মিশে যাবে।`],
[['big bang','universe','expansion','বিগ ব্যাং','মহাবিশ্ব'],`The Big Bang theory says the universe expanded from an extremely hot, dense state about 13.8 billion years ago. Evidence: galaxies recede from us (Hubble's law), the cosmic microwave background glows at 2.7 K, and hydrogen/helium abundances match predictions. Space itself is expanding, and the expansion is accelerating, which we attribute to dark energy.`,`মহাবিশ্ব প্রায় ১৩.৮ বিলিয়ন বছর আগে অতি উত্তপ্ত ঘন অবস্থা থেকে প্রসারিত হতে শুরু করে—এটাই বিগ ব্যাং তত্ত্ব। প্রমাণ: গ্যালাক্সিগুলো দূরে সরছে (হাবলের সূত্র), ২.৭ K তাপমাত্রার মহাজাগতিক পটভূমি বিকিরণ, এবং হাইড্রোজেন-হিলিয়ামের অনুপাত। প্রসারণ ত্বরান্বিত হচ্ছে, যার কারণ ডার্ক এনার্জি ধরা হয়।`],
[['dark matter','dark energy','ডার্ক ম্যাটার','ডার্ক এনার্জি'],`Dark matter (~27% of the universe) is invisible matter detected through gravity: galaxies rotate too fast and clusters bend light more than visible matter explains. Dark energy (~68%) drives the accelerating expansion. Ordinary atoms make up only ~5%.`,`ডার্ক ম্যাটার (মহাবিশ্বের ~২৭%) অদৃশ্য, শুধু মহাকর্ষীয় প্রভাবে ধরা পড়ে—গ্যালাক্সি প্রত্যাশার চেয়ে দ্রুত ঘোরে, ক্লাস্টার বেশি আলো বাঁকায়। ডার্ক এনার্জি (~৬৮%) প্রসারণ ত্বরান্বিত করে। সাধারণ পদার্থ মাত্র ~৫%।`],

[['day and night','why day','rotation','দিন ও রাত','দিন-রাত কেন'],`Day and night happen because Earth rotates once every ~24 hours, so each place turns toward and then away from the Sun. Seasons are different: they come from Earth's 23.4° axial tilt, not from its distance to the Sun.`,`পৃথিবী প্রায় ২৪ ঘণ্টায় একবার নিজ অক্ষে ঘোরে, তাই প্রতিটি স্থান সূর্যের দিকে ও বিপরীতে ঘুরে দিন-রাত হয়। ঋতু আলাদা: তা পৃথিবীর অক্ষের ২৩.৪° হেলানোর কারণে, সূর্যের দূরত্বের কারণে নয়।`],

[['kepler','ellipse','কেপলার'],`Kepler's laws: (1) planets move in ellipses with the Sun at one focus; (2) the line from Sun to planet sweeps equal areas in equal times, so planets move fastest at perihelion; (3) T² ∝ a³, so distant planets have far longer years (Earth 1 yr at 1 AU, Neptune ~165 yr at 30 AU). Newton later showed all three follow from gravity.`,`কেপলারের সূত্র: (১) গ্রহের কক্ষপথ উপবৃত্ত, সূর্য একটি ফোকাসে; (২) সমান সময়ে সূর্য-গ্রহ রেখা সমান ক্ষেত্রফল অতিক্রম করে, তাই সূর্যের কাছে গ্রহ দ্রুত চলে; (৩) T² ∝ a³, তাই দূরের গ্রহের বছর অনেক বড় (পৃথিবী ১ বছর, নেপচুন ~১৬৫ বছর)। নিউটন দেখান এ সবই মহাকর্ষ থেকে আসে।`],
[['season','tilt','ঋতু'],`Earth's axis is tilted 23.4°. Around 21 June the Northern Hemisphere leans toward the Sun (long days, summer); around 21 December it leans away (short days, winter). The equinoxes (21 March, 23 September) have nearly equal day and night.`,`পৃথিবীর অক্ষ ২৩.৪° হেলানো। ২১ জুনের কাছে উত্তর গোলার্ধ সূর্যের দিকে হেলে (দিন বড়, গ্রীষ্ম), ২১ ডিসেম্বরে বিপরীতে (দিন ছোট, শীত)। ২১ মার্চ ও ২৩ সেপ্টেম্বরে দিন-রাত প্রায় সমান।`],

 if(h(['রিসেট','reset']))return reset(),toast('↺'),1;

 if(h(['ট্যুর','tour']))return tour(true),1;
 if(h(['take off','takeoff','উড়ুন','উড়ো']))return takeoff(),1;
 if(h(['land','নামো','নামুন']))return land(i>=0?i:selB),1;
 if(h(['টেলিপোর্ট','teleport','go to','যাও'])&&i>=0)return tp(i),toast('✈ '+nm(B[i])),1;
 return 0}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,lis=false;
function mic(){if(!SR)return toast('Voice: use Chrome');if(lis){lis=false;rec.stop();document.querySelectorAll('.mic').forEach(e=>e.classList.remove('on'));return}
 const go=()=>{rec=new SR();rec.lang=LG[lang][1];rec.continuous=true;rec.interimResults=false;rec.onresult=e=>handle(e.results[e.results.length-1][0].transcript);rec.onend=()=>{if(lis)setTimeout(go,200)};
  rec.onerror=e=>{if(e.error=='aborted')return;const bad=e.error=='not-allowed'||e.error=='service-not-allowed';if(bad){lis=false;document.querySelectorAll('.mic').forEach(x=>x.classList.remove('on'))}toast(bad?'🎤 '+t(49):e.error=='network'?(isBn()?'🎤 ইন্টারনেট নেই':'🎤 No internet'):e.error=='audio-capture'?'🎤 ✖':e.error=='no-speech'?'🎤 …':'🎤 '+e.error,6000)};try{rec.start()}catch(e){}};
 lis=true;document.querySelectorAll('.mic').forEach(e=>e.classList.add('on'));go()}

/* ---------- radar pulse visualizer ---------- */
const rcx=$('rdr').getContext('2d'),RC={idle:[80,160,255],listen:[255,70,190],think:[170,110,255],speak:[60,255,220]};
(function rd(t){requestAnimationFrame(rd);const s=lis?'listen':thk?'think':spk?'speak':'idle',c=48,R=44,[r,g,b]=RC[s],col=a=>`rgba(${r},${g},${b},${a})`;rcx.clearRect(0,0,96,96);rcx.fillStyle='rgba(8,14,40,.45)';rcx.beginPath();rcx.arc(c,c,R+2,0,7);rcx.fill();rcx.lineWidth=1;rcx.strokeStyle=col(.35);
 for(let i=1;i<=3;i++){rcx.beginPath();rcx.arc(c,c,R*i/3,0,7);rcx.stroke()}rcx.beginPath();rcx.moveTo(c-R,c);rcx.lineTo(c+R,c);rcx.moveTo(c,c-R);rcx.lineTo(c,c+R);rcx.stroke();
 const sp={idle:.12,listen:.55,think:.3,speak:.4}[s];for(let k=0;k<3;k++){const p=(t/1000*sp+k/3)%1;rcx.strokeStyle=col((1-p)*(s=='idle'?.25:.8)*(s=='speak'?.6+.4*Math.sin(t/80):1));rcx.lineWidth=2*(1-p)+.5;rcx.beginPath();rcx.arc(c,c,R*(.2+.8*p),0,7);rcx.stroke()}
 const a=t/1000*(s=='think'?3.4:1.3);rcx.lineWidth=1.5;for(let i=0;i<30;i++){const q=a-i*.03;rcx.strokeStyle=col((1-i/30)*.45);rcx.beginPath();rcx.moveTo(c,c);rcx.lineTo(c+Math.cos(q)*R,c+Math.sin(q)*R);rcx.stroke()}})(0);

const NK='DEMO_KEY',esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let nasaOn=0,ND=null;

function renderNasa(){if(!ND)return;const{ap,ne,demo,day}=ND;$('nb').innerHTML=`<div class="font-bold text-cyan-300">🌌 ${t(45)} · ${esc(ap.title)}</div>${ap.media_type=='image'?`<img src="${esc(ap.url)}" alt="" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin:4px 0">`:''}<div class="opacity-90">${esc(ap.explanation.slice(0,380))}…</div><button id="nx" class="b mt-1">🤖 ${t(4)}</button>

async function loadNasa(force){if((nasaOn||ND)&&!force)return;nasaOn=1;const day=new Date().toISOString().slice(0,10),demo=[];$('nb').textContent='⏳ NASA…';let ap,ne;

 catch(e){demo.push('NeoWs');ne=[{n:'2024 XY1',d:120,v:'14.2',h:false},{n:'2023 QR7',d:48,v:'9.6',h:false},{n:'2022 MK3',d:310,v:'18.7',h:false}]}
